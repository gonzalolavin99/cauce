[build]
  command = "npm run build:web"
  publish = "dist"

# SPA fallback para rutas de expo-router (cliente resuelve el enrutamiento).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker nunca debe cachearse de forma agresiva: debe revalidarse
# para que las nuevas versiones se apliquen al recargar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# El manifest puede revalidarse sin cache largo.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Assets versionados de Expo (hash en el nombre): cache largo e inmutable.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
